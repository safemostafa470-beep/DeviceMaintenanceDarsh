<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة تسجيل دخول الفنيين - الهوارى VIP</title>
    <!-- مكتبة Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- خط Cairo الحديث والاحترافي -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-deep: #060913;
            --card-surface: rgba(15, 23, 42, 0.75);
            --primary-neon: #38bdf8;
            --primary-glow: rgba(56, 189, 248, 0.35);
            --accent-gradient: linear-gradient(135deg, #00f2fe 0%, #0284c7 100%);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --glass-border: rgba(255, 255, 255, 0.1);
            --glass-border-focus: rgba(56, 189, 248, 0.5);
            --danger-color: #f43f5e;
            --success-color: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* كرات إضاءة خلفية نيون لتعطي عمقاً سينمائياً للمشهد */
        .ambient-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            z-index: 0;
            pointer-events: none;
            opacity: 0.6;
        }
        .orb-1 {
            width: 320px;
            height: 320px;
            background: radial-gradient(circle, #0284c7, #38bdf8);
            top: 10%;
            right: 15%;
            animation: floatOrb 10s ease-in-out infinite alternate;
        }
        .orb-2 {
            width: 280px;
            height: 280px;
            background: radial-gradient(circle, #6366f1, #a855f7);
            bottom: 10%;
            left: 15%;
            animation: floatOrb 8s ease-in-out infinite alternate-reverse;
        }

        @keyframes floatOrb {
            0% { transform: translateY(0) scale(1); }
            100% { transform: translateY(-40px) scale(1.1); }
        }

        /* كارت تسجيل الدخول الزجاجي */
        .login-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 440px;
        }

        .login-card {
            background: var(--card-surface);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            padding: 40px 32px;
            border-radius: 28px;
            box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.7),
                        inset 0 1px 0 rgba(255, 255, 255, 0.1);
            text-align: center;
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .login-card:hover {
            border-color: rgba(56, 189, 248, 0.25);
        }

        /* الشعار و رأس الكارت */
        .brand-badge {
            width: 65px;
            height: 65px;
            margin: 0 auto 16px;
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.2), rgba(2, 132, 199, 0.05));
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            box-shadow: 0 10px 25px rgba(56, 189, 248, 0.2);
        }

        .login-card h2 {
            font-size: 2rem;
            font-weight: 900;
            background: linear-gradient(135deg, #ffffff 0%, #38bdf8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
            margin-bottom: 4px;
        }

        .login-card .sub-title {
            color: var(--text-sub);
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 22px;
        }

        /* زر بوابة العملاء */
        .btn-client-access {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            background: rgba(56, 189, 248, 0.06);
            color: var(--primary-neon);
            border: 1px dashed rgba(56, 189, 248, 0.4);
            padding: 12px 16px;
            border-radius: 14px;
            font-size: 0.92rem;
            font-weight: 700;
            text-decoration: none;
            margin-bottom: 25px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-client-access:hover {
            background: rgba(56, 189, 248, 0.15);
            border-style: solid;
            border-color: var(--primary-neon);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(56, 189, 248, 0.15);
        }

        /* الحقول و المدخلات */
        .form-group {
            margin-bottom: 18px;
            text-align: right;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-sub);
            padding-right: 4px;
        }

        .input-box {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            right: 14px;
            color: var(--text-sub);
            font-size: 1.1rem;
            pointer-events: none;
            transition: color 0.3s ease;
        }

        .input-box input {
            width: 100%;
            padding: 13px 44px 13px 44px;
            border-radius: 14px;
            border: 1px solid var(--glass-border);
            background: rgba(10, 15, 29, 0.6);
            color: var(--text-main);
            font-size: 0.95rem;
            font-weight: 600;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-box input:focus {
            border-color: var(--primary-neon);
            box-shadow: 0 0 0 4px var(--primary-glow);
            background: rgba(15, 23, 42, 0.85);
        }

        .input-box input:focus + .input-icon {
            color: var(--primary-neon);
        }

        .toggle-password {
            position: absolute;
            left: 14px;
            cursor: pointer;
            color: var(--text-sub);
            font-size: 1.1rem;
            user-select: none;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s ease;
        }

        .toggle-password:hover {
            color: var(--primary-neon);
        }

        /* خيار تذكرني */
        .remember-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 18px 0 24px;
            text-align: right;
            font-size: 0.88rem;
            font-weight: 600;
            color: var(--text-sub);
            cursor: pointer;
            user-select: none;
        }

        .remember-row input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--primary-neon);
            cursor: pointer;
            border-radius: 6px;
        }

        /* زر الدخول الرئيسي */
        .btn-login {
            background: var(--accent-gradient);
            color: #060913;
            border: none;
            padding: 14px;
            border-radius: 14px;
            font-weight: 800;
            width: 100%;
            cursor: pointer;
            font-size: 1.05rem;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
            box-shadow: 0 8px 24px rgba(2, 132, 199, 0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(56, 189, 248, 0.45);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .btn-login:disabled {
            background: #334155;
            color: #64748b;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* رسالة الخطأ المتجاوبة */
        .error-msg {
            color: #fecdd3;
            font-size: 0.86rem;
            font-weight: 600;
            margin-top: 14px;
            display: none;
            line-height: 1.5;
            background: rgba(244, 63, 94, 0.12);
            border: 1px solid rgba(244, 63, 94, 0.3);
            padding: 12px;
            border-radius: 12px;
            text-align: right;
            animation: shake 0.4s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            75% { transform: translateX(6px); }
        }

        /* بطاقة التواصل والدعم الفني */
        .contact-section {
            margin-top: 26px;
            padding: 14px 16px;
            border-radius: 16px;
            background: rgba(10, 15, 29, 0.45);
            border: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .contact-meta {
            display: flex;
            flex-direction: column;
            text-align: right;
        }

        .contact-meta span {
            font-size: 0.75rem;
            color: var(--text-sub);
        }

        .phone-text {
            font-size: 0.95rem;
            color: #ffffff;
            direction: ltr;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        .contact-actions {
            display: flex;
            gap: 6px;
        }

        .btn-action-sm {
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 700;
            text-decoration: none;
            border: 1px solid transparent;
            transition: all 0.2s ease;
        }

        .btn-copy {
            background: rgba(56, 189, 248, 0.12);
            color: var(--primary-neon);
            border-color: rgba(56, 189, 248, 0.25);
        }
        .btn-copy:hover {
            background: var(--primary-neon);
            color: #060913;
        }

        .btn-wa {
            background: rgba(16, 185, 129, 0.15);
            color: #34d399;
            border-color: rgba(16, 185, 129, 0.3);
        }
        .btn-wa:hover {
            background: var(--success-color);
            color: #ffffff;
        }

        /* الفوتر */
        .footer-credit {
            margin-top: 24px;
            font-size: 0.82rem;
            color: var(--text-sub);
        }
        .footer-credit span {
            color: var(--primary-neon);
            font-weight: 800;
        }

        /* لودر التحميل داخل الزر */
        .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid rgba(6, 9, 19, 0.2);
            border-top-color: #060913;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            display: inline-block;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <!-- كرات الإضاءة الديكورية -->
    <div class="ambient-orb orb-1"></div>
    <div class="ambient-orb orb-2"></div>

    <div class="login-wrapper">
        <div class="login-card">
            
            <!-- لوجو الشعار الفاخر -->
            <div class="brand-badge">🛠️</div>
            <h2>الهوارى VIP</h2>
            <div class="sub-title">المنصة الشاملة لإدارة مراكز الصيانة المتقدمة</div>
            
            <!-- رابط تحويل العملاء -->
            <a href="index.html" class="btn-client-access">
                <span>🔍</span>
                <span>بوابة استعلام العملاء (تتبع الأجهزة)</span>
            </a>

            <!-- نموذج الدخول -->
            <form id="loginForm">
                <div class="form-group">
                    <label>اسم المستخدم (الفني / الفرع):</label>
                    <div class="input-box">
                        <input type="text" id="username" placeholder="أدخل اسم المستخدم" required autocomplete="username">
                        <span class="input-icon">👤</span>
                    </div>
                </div>

                <div class="form-group">
                    <label>كلمة المرور:</label>
                    <div class="input-box">
                        <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
                        <span class="input-icon">🔒</span>
                        <span class="toggle-password" onclick="togglePasswordVisibility()" title="إظهار / إخفاء">👁️</span>
                    </div>
                </div>

                <label class="remember-row">
                    <input type="checkbox" id="rememberMe">
                    <span>حفظ بيانات تسجيل الدخول على هذا الجهاز</span>
                </label>

                <button type="submit" id="submitBtn" class="btn-login">
                    <span>تسجيل الدخول للنظام</span>
                </button>
            </form>

            <p class="error-msg" id="errorMsg"></p>

            <!-- صندوق المساعدة والدعم -->
            <div class="contact-section">
                <div class="contact-meta">
                    <span>للدعم وتجديد الحساب:</span>
                    <span class="phone-text" id="phoneNum">0575840397</span>
                </div>
                <div class="contact-actions">
                    <a href="https://wa.me/966575840397" target="_blank" class="btn-action-sm btn-wa" title="محادثة واتساب">واتساب</a>
                    <button type="button" class="btn-action-sm btn-copy" onclick="copyPhone(event)">نسخ</button>
                </div>
            </div>

            <div class="footer-credit">
                تصميم وبرمجة <span>الهوارى للبرمجيات</span>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://vvxkxmktkxawptbrqtut.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ2eGt4bWt0a3hhd3B0YnJxdHV0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA0NDY2MTcsImV4cCI6MjEwNjAyMjYxN30.NkqXPEpMf6VFE3nFQ1V7T5HyjfoxIrT_apKh7S6a_14';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        window.onload = function() {
            const savedUser = localStorage.getItem('saved_username');
            if(savedUser) {
                document.getElementById('username').value = savedUser;
                document.getElementById('rememberMe').checked = true;
            }
        };

        // تبديل إظهار وإخفاء كلمة المرور
        function togglePasswordVisibility() {
            const passInput = document.getElementById('password');
            passInput.type = passInput.type === 'password' ? 'text' : 'password';
        }

        document.getElementById('loginForm').addEventListener('submit', async function(event) {
            event.preventDefault();
            
            const errorEl = document.getElementById('errorMsg');
            const submitBtn = document.getElementById('submitBtn');
            errorEl.style.display = 'none';

            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();
            const remember = document.getElementById('rememberMe').checked;

            submitBtn.disabled = true;
            submitBtn.innerHTML = `<span class="spinner"></span> <span>جاري التحقق من السيرفر...</span>`;

            try {
                const { data, error } = await _supabase
                    .from('technicians')
                    .select('*')
                    .eq('username', user)
                    .maybeSingle();

                if (error) throw new Error(error.message);

                if (!data) {
                    showError('اسم المستخدم غير مسجل بالنظام!');
                    resetButton();
                    return;
                }

                const dbPass = data.password || data.pass;
                if (dbPass !== pass) {
                    showError('كلمة المرور غير صحيحة، يرجى التأكد والمحاولة ثانية!');
                    resetButton();
                    return;
                }

                if (data.status === 'موقوف' || data.status === 'وقف' || data.is_active === false || data.active === false) {
                    showError('عذراً، هذا الحساب معطل أو موقوف من قبل الإدارة.');
                    resetButton();
                    return;
                }

                if (data.expiry_date) {
                    const today = new Date().toISOString().split('T')[0];
                    if (today > data.expiry_date) {
                        showError('عذراً، انتهت صلاحية اشتراكك. يرجى التواصل مع الإدارة للتجديد.');
                        resetButton();
                        return;
                    }
                }

                // حفظ بيانات الجلسة
                localStorage.setItem('isLoggedIn', 'true');
                localStorage.setItem('currentUser', user);
                localStorage.setItem('username', user);
                localStorage.setItem('currentTech', user);
                localStorage.setItem('shopData', JSON.stringify(data));

                if(remember) {
                    localStorage.setItem('saved_username', user);
                } else {
                    localStorage.removeItem('saved_username');
                }
                
                submitBtn.innerHTML = `<span>تم التحقق بنجاح ✓</span>`;
                submitBtn.style.background = '#10b981';

                setTimeout(() => {
                    window.location.href = 'dashboard.html?user=' + encodeURIComponent(user);
                }, 500);

            } catch (err) {
                console.error(err);
                showError('حدث خطأ أثناء الاتصال: ' + err.message);
                resetButton();
            }
        });

        function showError(msg) {
            const errorEl = document.getElementById('errorMsg');
            errorEl.style.display = 'block';
            errorEl.innerText = msg;
        }

        function resetButton() {
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = false;
            submitBtn.innerHTML = `<span>تسجيل الدخول للنظام</span>`;
        }

        function copyPhone(event) {
            const phoneText = document.getElementById('phoneNum').innerText;
            navigator.clipboard.writeText(phoneText).then(() => {
                const btn = event.target;
                btn.innerText = 'تم ✓';
                btn.style.background = '#10b981';
                btn.style.color = '#ffffff';
                setTimeout(() => {
                    btn.innerText = 'نسخ';
                    btn.style.background = '';
                    btn.style.color = '';
                }, 2000);
            });
        }
    </script>
</body>
</html>
